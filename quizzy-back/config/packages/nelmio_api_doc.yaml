nelmio_api_doc:
    documentation:
        components:
            securitySchemes:
                BearerAuth:
                    type: http
                    scheme: bearer
        security:
            - BearerAuth: []
        info:
            title: Quizzy API
            description: Quizzy API documentation
            version: 1.0.0
    areas: # to filter documented areas
        path_patterns:
            - ^/api(?!/doc$) # Accepts routes under /api except /api/doc
